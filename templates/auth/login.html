<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រាស់ប្រព័ន្ធ | HRMS កម្ពុជា</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .auth-bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
        }
        .auth-blob-1 {
            background: #4f46e5;
            top: -100px;
            left: -100px;
        }
        .auth-blob-2 {
            background: #06b6d4;
            bottom: -150px;
            right: -100px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            padding: 40px 36px;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .auth-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 13.5px;
            color: #64748b;
        }

        .auth-form-group {
            margin-bottom: 20px;
        }

        .auth-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-wrap i.prefix-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .auth-input {
            width: 100%;
            height: 46px;
            padding: 10px 42px 10px 40px;
            font-size: 14.5px;
            font-family: inherit;
            color: #1e293b;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        .auth-input:focus {
            background: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .auth-input:focus ~ i.prefix-icon {
            color: #4f46e5;
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .pwd-toggle-btn:hover {
            color: #4f46e5;
        }

        .auth-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .auth-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .auth-checkbox-label input {
            accent-color: #4f46e5;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-submit-auth {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
        }

        .btn-submit-auth:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
        }

        .btn-submit-auth:active {
            transform: translateY(0);
        }

        .auth-card-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 13.5px;
            color: #64748b;
        }

        .auth-card-footer a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
            transition: color 0.2s;
        }

        .auth-card-footer a:hover {
            color: #3730a3;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-bg-blob auth-blob-1"></div>
        <div class="auth-bg-blob auth-blob-2"></div>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <i class="fa-solid fa-users-gear"></i>
                </div>
                <h1>ប្រព័ន្ធគ្រប់គ្រងធនធានមនុស្ស</h1>
                <p>Cambodia HR Management System (HRMS)</p>
            </div>

            <!-- Flash Alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div style="margin-bottom: 20px;">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}" style="font-size: 13.5px; padding: 10px 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                                <span><i class="fa-solid fa-circle-info" style="margin-right: 6px;"></i>{{ message }}</span>
                                <button type="button" class="close-alert" onclick="this.parentElement.remove();" style="background: none; border: none; font-size: 18px; cursor: pointer; color: inherit; line-height: 1;">&times;</button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
                <div class="auth-form-group">
                    <label class="auth-label" for="username">
                        <i class="fa-regular fa-user" style="margin-right: 5px; color: #6366f1;"></i>
                        គណនីប្រើប្រាស់ (Username)
                    </label>
                    <div class="input-icon-wrap">
                        <input type="text" id="username" name="username" class="auth-input num" 
                               value="{{ username or '' }}" placeholder="បញ្ចូលគណនី ឬ admin" required autofocus autocomplete="username">
                        <i class="fa-solid fa-circle-user prefix-icon"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="password">
                        <i class="fa-solid fa-lock" style="margin-right: 5px; color: #6366f1;"></i>
                        លេខសម្ងាត់ (Password)
                    </label>
                    <div class="input-icon-wrap">
                        <input type="password" id="password" name="password" class="auth-input num" 
                               placeholder="បញ្ចូលលេខសម្ងាត់" required autocomplete="current-password">
                        <i class="fa-solid fa-key prefix-icon"></i>
                        <button type="button" class="pwd-toggle-btn" onclick="togglePassword('password', this)" title="បង្ហាញ/លាក់ លេខសម្ងាត់">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-meta-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" name="remember" value="1" checked>
                        <span>ចងចាំគណនី (Remember me)</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit-auth">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>ចូលប្រើប្រាស់ (Sign In)</span>
                </button>
            </form>

            <div class="auth-card-footer">
                <span>មិនទាន់មានគណនីទេមែនទេ?</span>
                <a href="{{ url_for('register') }}">
                    <i class="fa-solid fa-user-plus" style="margin-right: 3px;"></i>ចុះឈ្មោះនៅទីនេះ (Register)
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }
    </script>
</body>
</html>
